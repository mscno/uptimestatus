[package]
name = "uptime-store"
description = "PostgreSQL, SQLite and Turso persistence for uptimestatus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Builds the `toasty` migration CLI (`mise run db:migration:new <name>`).
cli = ["dep:toasty-cli", "dep:anyhow", "tokio/rt-multi-thread"]

[[bin]]
name = "toasty"
path = "src/bin/toasty.rs"
required-features = ["cli"]

[dependencies]
futures-util.workspace = true
jiff.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toasty.workspace = true
toasty-core.workspace = true
toasty-driver-turso.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
uptime-domain.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tokio-util.workspace = true

anyhow = { workspace = true, optional = true }
toasty-cli = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true
pretty_assertions.workspace = true
tokio.workspace = true
uptime-testkit.workspace = true

[lints]
workspace = true
